services:
  server:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - NODE_ENV=production
      - CLIENT_URL=${CLIENT_URL}

  client:
    build: ./client
    ports:
      - "80:80"
    depends_on:
      - server
